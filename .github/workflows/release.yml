name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          prev_tag=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -n "$prev_tag" ]; then
            echo "previous=$prev_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          draft: false

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # idempotent: wheel may already exist if re-running after pyapp failure

  pyapp:
    name: Build PyApp binary (${{ matrix.target }})
    needs: publish
    strategy:
      fail-fast: false  # one failing target should not cancel the others
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: shoal-darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            asset: shoal-darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: shoal-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build self-contained binary
        env:
          PYAPP_PROJECT_NAME: shoal-cli
          PYAPP_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          PYAPP_PYTHON_VERSION: "3.12"
          PYAPP_EXEC_MODULE: shoal.cli
          PYAPP_PIP_EXTRA_ARGS: "--extra mcp"
        run: |
          cargo install pyapp --force --root output
          cp output/bin/pyapp "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY" --clobber