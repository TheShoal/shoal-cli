[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoal-cli"
dynamic = ["version"]
description = "Terminal-first orchestration for parallel AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ricardo Roche"},
]
keywords = ["tmux", "agents", "ai", "orchestration", "worktree", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "watchfiles>=0.21.0",
]

[project.scripts]
shoal = "shoal.cli:app"
shoal-mcp-proxy = "shoal.services.mcp_proxy:main"
shoal-mcp-server = "shoal.services.mcp_shoal_server:main"
shoal-robo-supervisor = "shoal.services.robo_supervisor:main"
shoal-status = "shoal.services.status_bar:main"

[project.urls]
Homepage = "https://github.com/TheShoal/shoal-cli"
Documentation = "https://theshoal.github.io/shoal-cli"
Repository = "https://github.com/TheShoal/shoal-cli"
Issues = "https://github.com/TheShoal/shoal-cli/issues"
Changelog = "https://github.com/TheShoal/shoal-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.0.0",
]
claw = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "gitlint>=0.19.0",
    "pytest-xdist>=3.5.0",
    "fastmcp>=3.0.0",
]
docs = [
    "mkdocs<2.0",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-material>=9.7.4",
    "mkdocstrings-python>=2.0.3",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shoal"]

[tool.hatch.build.targets.wheel.force-include]
"examples/config" = "shoal/examples/config"

[tool.hatch.version]
path = "src/shoal/__init__.py"
expression = "__version__"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "PERF", "RUF", "LOG", "G", "C4", "PIE", "DTZ", "RET", "RSE", "S"]
ignore = ["ASYNC240", "RUF001", "S101", "S603", "S607", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM117", "E501"]
# Delegation wrapper uses blocking subprocess by design (proxy pattern)
"src/shoal/integrations/lobster/delegation_wrapper.py" = ["ASYNC221", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["shoal.core.proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["shoal.core.claw_client", "grpc", "grpc.*"]
disallow_untyped_calls = false
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shoal.services.runtime_providers.claw"]
warn_return_any = false

[[tool.mypy.overrides]]
module = "shoal.core.claw_conversations"
disable_error_code = ["call-overload", "arg-type"]

[[tool.mypy.overrides]]
module = "shoal.services.mcp_shoal_server"
disable_error_code = ["call-arg", "attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shoal.services.ai_client"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: tests that require tmux and external tools",
    "live: tests that require a live external endpoint",
]

[tool.coverage.run]
source = ["src/shoal"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 73  # lowered from 80: ai_client, fs_watcher, proactive_supervisor need tests (v0.36.0)
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603", "B607", "B108", "B608"]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "basedpyright>=1.38.1",
]

[tool.ruff.lint.extend-per-file-ignores]
"src/shoal/core/proto/*.py" = ["E501", "E402", "I001"]  # generated files
