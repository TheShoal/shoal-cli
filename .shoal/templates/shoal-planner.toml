# shoal-planner — Milestone planner / architect for shoal-cli.
#
# Scope features, write ROADMAP entries, design APIs.
# Cheap model — read-heavy, minimal writes.
#
# Usage:
#   shoal new plan/my-feature --template shoal-planner --branch

[template]
name        = "shoal-planner"
description = "Scope features and write ROADMAP entries for shoal-cli"
extends     = "base-dev"
tool        = "pisces"
mcp         = ["shoal-orchestrator", "memory"]
mode        = "planner"
tags        = ["dogfood", "planner"]

[template.git]
branch_prefix = "plan/"

[template.worktree]
post_worktree_create = "examples/scripts/shoal-skill-sync.sh"
