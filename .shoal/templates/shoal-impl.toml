# shoal-impl — Feature implementer for shoal-cli.
#
# Python 3.12+, async-first, mypy --strict enforced.
# Powerful model — writes code, runs tests, follows conventional commits.
#
# Invariants to preserve (from ARCHITECTURE.md):
#   - All I/O via async/await; blocking calls wrapped in asyncio.to_thread()
#   - CLI and API delegate to services/lifecycle.py — never bypass it
#   - SQLite writes guarded by asyncio.Lock
#   - New MCP tools must have docstrings and be counted in tour.py
#
# Usage:
#   shoal new feat/my-feature --template shoal-impl --branch

[template]
name        = "shoal-impl"
description = "Feature implementer — async Python, mypy strict, conventional commits"
extends     = "base-dev"
tool        = "pisces"
mcp         = ["shoal-orchestrator", "memory"]
mode        = "implementer"
tags        = ["dogfood", "impl"]

[template.git]
branch_prefix = "feat/"

[template.worktree]
post_worktree_create = "examples/scripts/shoal-skill-sync.sh"
