# shoal-release — Release cutter for shoal-cli (omp).
#
# Deterministic, low-reasoning work: bump version, update CHANGELOG, and
# prepare the release branch and tag instructions.
#
# Unlike interactive roles, this template keeps an explicit git identity because
# it is intended for deliberate release automation.
#
# Usage:
#   shoal new release/v0.37.0 --template shoal-release --branch \
#     --prompt "/shoal-release v0.37.0"

[template]
name        = "shoal-release"
description = "Release cutter — changelog, version bump, and tag prep"
extends     = "base-dev"
tool        = "omp"
mcp         = ["shoal-orchestrator"]
mode        = "release"
tags        = ["dogfood", "release"]

[template.env]
SHOAL_AGENT = "1"

[template.git]
user_name     = "Shoal Release Agent"
user_email    = "release@shoal.local"
branch_prefix = "release/"

[template.worktree]
post_worktree_create = "examples/scripts/shoal-skill-sync.sh"
