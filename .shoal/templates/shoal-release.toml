# shoal-release — Release cutter template for shoal-cli.
#
# Uses pisces with the `commit` model role (github-copilot/claude-haiku-4.5).
# Deterministic, low-reasoning work: bump version in pyproject.toml,
# update CHANGELOG.md, tag. Uses shoal-release and shoal-changelog skills.
#
# Usage:
#   shoal new release/v0.37.0 --template shoal-release --branch \
#     --prompt "/shoal-release v0.37.0"

[template]
name        = "shoal-release"
description = "Shoal release cutter — pisces commit model, changelog + version bump"
extends     = "base-dev"
tool        = "pisces"
mcp         = ["shoal-orchestrator"]
tags        = ["dogfood", "release"]

[template.env]
SHOAL_TOOL  = "pisces"
SHOAL_AGENT = "1"
# Route to the `commit` model role: github-copilot/claude-haiku-4.5
PISCES_LAUNCH_ARGS = "--model github-copilot/claude-haiku-4.5"

[template.git]
user_name     = "Shoal Release Agent"
user_email    = "release@shoal.local"
branch_prefix = "release/"
