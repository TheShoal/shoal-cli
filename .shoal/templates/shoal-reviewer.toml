# shoal-reviewer — Code reviewer for shoal-cli (omp).
#
# Fast, cheap. Diff-review doctrine: behavioral regressions first, style last.
# Read-oriented — does not write implementation code.
#
# Review tiers (in order):
#   1. Behavioral regressions (async invariants, lifecycle delegation, SQLite)
#   2. Config/deployment risk (extra="forbid", new MCP tools, CLI registration)
#   3. Test coverage (new public functions, async test markers, mocked deps)
#   4. Contract drift (ARCHITECTURE.md invariants, CHANGELOG needs)
#   5. Type safety (mypy --strict violations, Any usage)
#   6. Style (last — never outranks correctness)
#
# Usage:
#   shoal new review/my-feature --template shoal-reviewer --branch \
#     --prompt "/shoal-review"

[template]
name        = "shoal-reviewer"
description = "Diff reviewer — behavioral regressions first, style last"
extends     = "base-dev"
tool        = "omp"
mcp         = ["shoal-orchestrator"]
mode        = "reviewer"
tags        = ["dogfood", "reviewer"]

[template.worktree]
post_worktree_create = "examples/scripts/shoal-skill-sync.sh"
