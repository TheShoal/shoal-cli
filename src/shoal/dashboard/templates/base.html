<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Shoal{% endblock %} — Mission Control</title>
  <link rel="icon" href="/ui/static/robo-fish.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/static/style.css">
  <script src="/ui/static/htmx.min.js" defer></script>
  <script src="/ui/static/ws.js" defer></script>
  <script src="/ui/static/shoal.js" defer></script>
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="/ui/">
      <img class="nav-brand-icon" src="/ui/static/robo-fish.svg" alt="Shoal" width="22" height="18">
      <span>Shoal</span>
    </a>
    <span class="nav-spacer"></span>
    {% block nav_extra %}<a class="nav-link" href="/ui/flow">Flow</a><a class="nav-link" href="/ui/mcp-matrix">MCP</a><a class="nav-link" href="https://theshoal.github.io/shoal-cli/" target="_blank" rel="noopener">Docs</a>{% endblock %}
    <span class="nav-version">{% block nav_version %}{% endblock %}</span>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
