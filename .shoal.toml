# .shoal.toml — project-level Shoal defaults for shoal-cli.
# Inherited by all sessions in this repo.
# Precedence: project < template < CLI flags

default_tool = "omp"
default_template = "shoal-impl"
setup_commands = [
    "uv sync --extra dev --quiet",
    "git fetch --quiet origin",
]

[env]
# All sessions in this repo get these defaults.
# SHOAL_AGENT=1 disables pre-commit hooks inside the worktree.
SHOAL_AGENT = "1"
