# MCP Stacks — presets for MCP server groups
# Used by the MCP Matrix UI to quickly apply server sets to sessions.

[stacks.dev]
description = "Development essentials"
servers = ["filesystem", "github", "memory"]

[stacks.ops]
description = "Observability and fetch"
servers = ["fetch", "memory"]

[stacks.orchestration]
description = "Full orchestration stack"
servers = ["shoal-orchestrator", "memory"]
